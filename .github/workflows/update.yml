name: Update catalogue

on:
  schedule:
    - cron: '15,45 * * * *'
  workflow_dispatch:

concurrency:
  group: catalogue-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Checkout previous metadata
        uses: actions/checkout@v4
        with:
          ref: meta
          path: meta
        continue-on-error: true

      - name: Remove nested git metadata
        run: rm -rf meta/.git

      - name: Update catalogue
        run: pnpm catalogue:update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish meta branch
        uses: s0/git-publish-subdir-action@ac113f6bfe8896e85a373534242c949a7ea74c98
        env:
          REPO: self
          BRANCH: meta
          FOLDER: meta
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SQUASH_HISTORY: true
          MESSAGE: 'chore: update meta'

      - name: Sync meta to Cloudflare R2
        run: aws s3 sync meta "s3://${R2_BUCKET}" --endpoint-url "${R2_ENDPOINT}" --region auto --delete --only-show-errors
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
          R2_BUCKET: nons-plugin
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

      - name: Publish catalogue branch
        uses: s0/git-publish-subdir-action@ac113f6bfe8896e85a373534242c949a7ea74c98
        env:
          REPO: self
          BRANCH: catalogue
          FOLDER: catalogue
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SQUASH_HISTORY: true
          MESSAGE: 'chore: update catalogue'
